[project]
name = "planificateur-gardes"
version = "0.2.0"
description = "Multi-tenant on-call duty scheduler for medical clinics."
authors = [{ name = "Juan Manuel Suárez", email = "info@arrakis.lu" }]
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
# Dependencies are declared in [tool.poetry.dependencies] below.
dynamic = ["dependencies"]

[tool.poetry]
# Application, not a library: dependencies only, the project itself is never installed.
package-mode = false

# Constraints: ^ for packages following semver >= 1.0, ~ for 0.x packages
# (where every minor release may break the API).
[tool.poetry.dependencies]
python = "^3.12"
fastapi = "~0.143"
uvicorn = { version = "~0.54", extras = ["standard"] }
sqlalchemy = { version = "^2.1", extras = ["asyncio"] }
asyncpg = "~0.32"
alembic = "^1.20"
pydantic = "^2.14"
pydantic-settings = "^2.15"
jinja2 = "^3.1"
python-multipart = "~0.0.32"
argon2-cffi = "^25.1"
itsdangerous = "^2.2"
httpx = "~0.28"
slowapi = "~0.1.10"
email-validator = "^2.3"
python-dateutil = "^2.9"
weasyprint = "^70.0"
sse-starlette = "^3.5"
sentry-sdk = { version = "^2.71", extras = ["fastapi"] }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.4"
pytest-cov = "^7.1"
ruff = "~0.17"
mypy = "^1.20"
pre-commit = "^4.6"
types-python-dateutil = "^2.9"
pypdf = "^6.20"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", "*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "RUF",
]
ignore = []
# EN DASH used on purpose in the SPDX copyright header (see CONTRIBUTING.md).
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # S311: seeded PRNG is the point in tests

# ---------------------------------------------------------------------------
# Mypy (strict on app/, relaxed on tests and migrations)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["weasyprint.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# Pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=app --cov-report=term-missing"
markers = [
    "db: tests that need a reachable PostgreSQL (skipped if unavailable)",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy async runs ORM code inside greenlets; without this it is not traced.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true

# Weekly dependency updates, grouped by kind so each week produces a few PRs, not dozens.
version: 2
updates:
  # Python dependencies (Poetry: pyproject.toml + poetry.lock)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      python-runtime:
        dependency-type: production
      python-dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Base image of docker/Dockerfile (python:3.12-slim)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    groups:
      docker-images:
        patterns: ["*"]

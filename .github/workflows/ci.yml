name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, migrations, tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planificateur_gardes
          POSTGRES_PASSWORD: planificateur_gardes
          POSTGRES_DB: planificateur_gardes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planificateur_gardes"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway CI database and key (not secrets).
      TEST_DATABASE_URL: postgresql+asyncpg://planificateur_gardes:planificateur_gardes@localhost:5432/planificateur_gardes_test
      DATABASE_URL: postgresql+asyncpg://planificateur_gardes:planificateur_gardes@localhost:5432/planificateur_gardes_test
      APP_SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Poetry (wheels only)
        run: pipx install poetry==2.5.1 --pip-args="--only-binary=:all:"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: poetry

      - name: Check lock file is in sync with pyproject.toml
        run: poetry check --lock

      - name: Install dependencies (wheels only, no setup scripts)
        env:
          POETRY_VIRTUALENVS_CREATE: "true"
          POETRY_NO_INTERACTION: "1"
          POETRY_INSTALLER_ONLY_BINARY: ":all:"
        run: poetry install --no-root --with dev

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format
        run: poetry run ruff format --check .

      - name: Mypy
        run: poetry run mypy app

      - name: Migrations round-trip and model sync
        run: |
          poetry run alembic upgrade head
          poetry run alembic downgrade base
          poetry run alembic upgrade head
          poetry run alembic check

      - name: Tests + coverage (fails under 70 %)
        run: poetry run pytest --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Production image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: false
          load: true
          tags: planificateur-gardes:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (imports, VERSION, no pip at runtime)
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            -e APP_SECRET_KEY=ci-only-secret-key-0123456789abcdef0123456789 \
            -e DATABASE_URL=postgresql+asyncpg://x:y@localhost/z \
            --entrypoint sh planificateur-gardes:ci -c '
              python -c "import app.main, weasyprint" &&
              test "$(cat /app/VERSION)" = "${{ github.sha }}" &&
              ! python -m pip --version 2>/dev/null'

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planificateur_gardes
          POSTGRES_PASSWORD: planificateur_gardes
          POSTGRES_DB: planificateur_gardes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planificateur_gardes"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://planificateur_gardes:planificateur_gardes@localhost:5432/planificateur_gardes_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry

      - name: Check lock file is in sync with pyproject.toml
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-root --with dev

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format
        run: poetry run ruff format --check .

      - name: Mypy
        run: poetry run mypy app

      - name: Migrations apply cleanly
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          APP_SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
        run: |
          poetry run alembic upgrade head
          poetry run alembic downgrade base
          poetry run alembic upgrade head

      - name: Tests + coverage
        run: poetry run pytest

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

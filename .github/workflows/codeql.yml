name: CodeQL

on:
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload results to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          queries: security-extended
          # Alembic reads revision / down_revision / branch_labels / depends_on by
          # introspection: "unused global variable" false positives in every migration.
          config: |
            paths-ignore:
              - alembic/versions/**
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:python"

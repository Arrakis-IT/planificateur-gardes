name: Release

# Builds and publishes the production image on version tags (v0.1.0, v1.2.3, …):
#   ghcr.io/arrakis-it/planificateur-gardes:<tag without v> and :latest
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/arrakis-it/planificateur-gardes

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # only this job pushes to ghcr.io (built-in GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is built through QEMU emulation: all dependencies ship arm64 wheels / Debian
      # packages, so it only costs build time (Hetzner ARM servers and Apple Silicon dev).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=planificateur-gardes
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.vendor=Arrakis IT Services

      # GIT_SHA is written to /app/VERSION inside the image (Sentry release).
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

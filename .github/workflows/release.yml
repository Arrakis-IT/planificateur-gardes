name: Release

# Builds and publishes the production image on version tags (v0.1.0, v1.2.3, …):
#   ghcr.io/arrakis-it/planificateur-gardes:<tag without v> and :latest
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write # push to ghcr.io with the built-in GITHUB_TOKEN

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/arrakis-it/planificateur-gardes

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # arm64 is built through QEMU emulation: all dependencies ship arm64 wheels / Debian
      # packages, so it only costs build time (Hetzner ARM servers and Apple Silicon dev).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=planificateur-gardes
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.vendor=Arrakis IT Services

      # GIT_SHA is written to /app/VERSION inside the image (Sentry release).
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

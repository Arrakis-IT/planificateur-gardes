name: Release

# Builds and publishes the production image on version tags (v0.1.0, v1.2.3, …):
#   ghcr.io/arrakis-it/planificateur-gardes:<tag without v> and :latest
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/arrakis-it/planificateur-gardes

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # only this job pushes to ghcr.io (built-in GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # arm64 is built through QEMU emulation: all dependencies ship arm64 wheels / Debian
      # packages, so it only costs build time (Hetzner ARM servers and Apple Silicon dev).
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=planificateur-gardes
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.vendor=Arrakis IT Services

      # GIT_SHA is written to /app/VERSION inside the image (Sentry release).
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

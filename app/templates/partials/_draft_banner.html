{% if draft_count %}
<div class="draft-banner">
  <output><strong>{{ draft_count }}</strong> modification{{ 's' if draft_count > 1 }} non enregistrée{{ 's' if draft_count > 1 }}
    <span class="muted">— visibles par tous les médecins du cabinet</span></output>
  {% if not auth.read_only %}
  <span class="draft-actions">
    <form method="post" action="/resultats/enregistrer" class="inline">
      {{ csrf_input(request) }}<input type="hidden" name="retour" value="{{ return_to }}">
      <button type="submit" class="primary">Enregistrer les modifications</button>
    </form>
    <form method="post" action="/resultats/annuler" class="inline">
      {{ csrf_input(request) }}<input type="hidden" name="retour" value="{{ return_to }}">
      <button type="submit">Annuler</button>
    </form>
  </span>
  {% endif %}
</div>
{% endif %}

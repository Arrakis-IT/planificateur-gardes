{% import "partials/_macros.html" as m %}
<div id="onsite-calendar">
  <form method="post" action="/sur-place/toggle" hx-post="/sur-place/toggle" hx-target="#onsite-calendar" hx-swap="outerHTML">
    {{ csrf_input(request) }}
    <input type="hidden" name="semestre" value="{{ semester }}">
    <div class="multi-month">
      {% for first in months %}{{ m.mini_month(first, period, marked, public_holidays, 'onsite') }}{% endfor %}
    </div>
  </form>
  <div class="holiday-summary">{{ marked|length }} jour{{ 's' if marked|length > 1 }} sur place sur ce semestre.</div>
</div>

{% import "partials/_macros.html" as m %}
<div id="desiderata-calendar">
  <form method="post" action="/desiderata/toggle" hx-post="/desiderata/toggle" hx-target="#desiderata-calendar" hx-swap="outerHTML">
    {{ csrf_input(request) }}
    <input type="hidden" name="debut" value="{{ debut }}">
    <div class="multi-month">
      {% for first in months %}{{ m.mini_month(first, period, marked, public_holidays, 'desiderata', first in locked_months) }}{% endfor %}
    </div>
  </form>
  <div class="holiday-summary">{{ marked|length }} jour{{ 's' if marked|length > 1 }} de desiderata sur cette période.</div>
</div>
